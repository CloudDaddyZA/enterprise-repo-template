# ============================================================================
# Governance Profile: Azure AI Landing Zone
# ============================================================================
# This profile defines the golden standard for Azure AI Landing Zone
# repositories. It is consumed by the governance engine workflows to
# create, assess, and remediate repositories.
# ============================================================================

name: Azure AI Landing Zone
description: Full Azure AI project with OIDC, RBAC, Key Vault, and ML workflows
version: "1.0.0"

# --------------------------------------------------------------------------
# Repository Settings
# --------------------------------------------------------------------------
repository:
  visibility: private
  default_branch: main
  delete_branch_on_merge: true
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  allow_auto_merge: true
  has_issues: true
  has_projects: true
  has_wiki: false
  is_template: false
  topics:
    - azure
    - ai
    - landing-zone
    - enterprise

# --------------------------------------------------------------------------
# Branch Protection / Rulesets
# --------------------------------------------------------------------------
rulesets:
  - name: main-protection
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - "refs/heads/main"
    rules:
      pull_request:
        required_approving_review_count: 2
        dismiss_stale_reviews: true
        require_code_owner_review: true
        require_last_push_approval: false
      required_status_checks:
        strict_required_status_checks_policy: true
        required_status_checks:
          - context: "CI Pipeline / Lint & Format"
          - context: "CI Pipeline / Unit Tests"
          - context: "CI Pipeline / Build"
          - context: "IaC Guardrails / Terraform Validate"
          - context: "IaC Guardrails / Bicep Validate"
      required_linear_history: true
      deletion: true
      non_fast_forward: true
    bypass_actors:
      - actor_type: OrganizationAdmin
      - actor_type: RepositoryRole
        role: maintain

# --------------------------------------------------------------------------
# Required Files
# --------------------------------------------------------------------------
required_files:
  - path: CODEOWNERS
    source: templates/CODEOWNERS
  - path: SECURITY.md
    source: templates/SECURITY.md
  - path: CONTRIBUTING.md
    source: templates/CONTRIBUTING.md
  - path: README.md
    source: templates/README.md
  - path: .gitignore
    source: templates/.gitignore
  - path: .github/pull_request_template.md
    source: templates/pull_request_template.md
  - path: .github/copilot-instructions.md
    source: templates/copilot-instructions.md
  - path: LICENSE
    source: templates/LICENSE

# --------------------------------------------------------------------------
# Workflows
# --------------------------------------------------------------------------
workflows:
  - name: ci.yml
    description: Continuous Integration (lint, test, build, security)
    required: true
  - name: cd.yml
    description: Continuous Deployment with environment gates
    required: true
  - name: codeql.yml
    description: CodeQL security scanning
    required: true
  - name: iac-guardrails.yml
    description: Terraform and Bicep validation
    required: true
  - name: release.yml
    description: Semantic versioning releases
    required: false
  - name: label-sync.yml
    description: Automated label synchronization
    required: false
  - name: stale.yml
    description: Stale issue/PR cleanup
    required: false

# --------------------------------------------------------------------------
# Environments
# --------------------------------------------------------------------------
environments:
  - name: dev
    protection_rules:
      required_reviewers: []
      wait_timer: 0
    deployment_branch_policy:
      protected_branches: false
      custom_branches:
        - "feature/*"
        - "main"
  - name: test
    protection_rules:
      required_reviewers: []
      wait_timer: 0
    deployment_branch_policy:
      protected_branches: false
      custom_branches:
        - "main"
        - "release/*"
  - name: staging
    protection_rules:
      required_reviewers:
        - count: 1
      wait_timer: 0
    deployment_branch_policy:
      protected_branches: true
  - name: production
    protection_rules:
      required_reviewers:
        - count: 2
      wait_timer: 5
    deployment_branch_policy:
      protected_branches: true

# --------------------------------------------------------------------------
# Security Controls
# --------------------------------------------------------------------------
security:
  code_scanning:
    enabled: true
    tool: codeql
    languages: [] # Auto-detect or specify: [javascript, python, go, etc.]
  secret_scanning:
    enabled: true
    push_protection: true
  dependabot:
    alerts: true
    security_updates: true
    version_updates:
      ecosystems:
        - package-ecosystem: github-actions
          directory: /
          schedule: weekly
        - package-ecosystem: terraform
          directory: /infra/terraform
          schedule: weekly
        - package-ecosystem: docker
          directory: /
          schedule: weekly
  dependency_review:
    enabled: true
    fail_on_severity: high

# --------------------------------------------------------------------------
# Azure Integration
# --------------------------------------------------------------------------
azure:
  oidc:
    enabled: true
    federated_credentials:
      - name: github-main
        subject: "repo:${REPO}:ref:refs/heads/main"
      - name: github-pr
        subject: "repo:${REPO}:pull_request"
      - name: github-env-staging
        subject: "repo:${REPO}:environment:staging"
      - name: github-env-production
        subject: "repo:${REPO}:environment:production"
  rbac:
    assignments:
      - role: Contributor
        scope: resource_group # or subscription
  key_vault:
    enabled: true
    purpose: "Store application secrets and certificates"
  policy_assignments: []

# --------------------------------------------------------------------------
# Labels
# --------------------------------------------------------------------------
labels:
  - name: bug
    color: "d73a4a"
    description: Something isn't working
  - name: enhancement
    color: "a2eeef"
    description: New feature or request
  - name: documentation
    color: "0075ca"
    description: Improvements or additions to documentation
  - name: security
    color: "e4e669"
    description: Security-related issue
  - name: infrastructure
    color: "d4c5f9"
    description: Infrastructure as Code changes
  - name: breaking-change
    color: "b60205"
    description: Breaking change requiring major version bump
  - name: dependencies
    color: "0366d6"
    description: Dependency updates
  - name: good first issue
    color: "7057ff"
    description: Good for newcomers
  - name: priority/high
    color: "b60205"
    description: High priority
  - name: priority/medium
    color: "fbca04"
    description: Medium priority
  - name: priority/low
    color: "0e8a16"
    description: Low priority

# --------------------------------------------------------------------------
# Teams & Permissions
# --------------------------------------------------------------------------
teams:
  - slug: "${TEAM_SLUG}-maintainers"
    permission: maintain
  - slug: "${TEAM_SLUG}-developers"
    permission: push
  - slug: "${TEAM_SLUG}-readonly"
    permission: pull
  - slug: security-team
    permission: pull

# --------------------------------------------------------------------------
# Project Board
# --------------------------------------------------------------------------
project:
  enabled: true
  name: "${PROJECT_NAME} Board"
  columns:
    - "Backlog"
    - "Ready"
    - "In Progress"
    - "In Review"
    - "Done"

# --------------------------------------------------------------------------
# Webhooks
# --------------------------------------------------------------------------
webhooks:
  - url: "${WEBHOOK_URL:-}"
    events:
      - push
      - pull_request
      - deployment_status
      - workflow_run
    content_type: json
    active: true

# --------------------------------------------------------------------------
# Milestones
# --------------------------------------------------------------------------
milestones:
  - title: "v1.0 - Foundation"
    description: "Repository setup, CI/CD, and base infrastructure"
  - title: "v1.1 - AI Integration"
    description: "ML pipelines, model training, and inference endpoints"
  - title: "v2.0 - Production"
    description: "Production deployment, monitoring, and scaling"
