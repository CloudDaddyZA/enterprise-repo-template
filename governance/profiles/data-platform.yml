# ============================================================================
# Governance Profile: Data Platform
# ============================================================================
# Profile for data engineering projects with strict compliance, lineage
# tracking, and data governance requirements.
# ============================================================================

name: Data Platform
description: Data engineering platform with strict compliance, Terraform IaC, and data governance
version: "1.0.0"

repository:
  visibility: private
  default_branch: main
  delete_branch_on_merge: true
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  allow_auto_merge: false # Require explicit merge for compliance
  has_issues: true
  has_projects: true
  has_wiki: true # Data documentation
  is_template: false
  topics:
    - data-platform
    - terraform
    - compliance
    - data-engineering

rulesets:
  - name: main-protection
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - "refs/heads/main"
    rules:
      pull_request:
        required_approving_review_count: 2
        dismiss_stale_reviews: true
        require_code_owner_review: true
        require_last_push_approval: true
      required_status_checks:
        strict_required_status_checks_policy: true
        required_status_checks:
          - context: "CI Pipeline / Lint & Format"
          - context: "CI Pipeline / Unit Tests"
          - context: "CI Pipeline / Build"
          - context: "IaC Guardrails / Terraform Validate"
          - context: "Security / CodeQL"
      required_linear_history: true
      required_signatures: true
      deletion: true
      non_fast_forward: true
    bypass_actors:
      - actor_type: OrganizationAdmin

required_files:
  - path: CODEOWNERS
    source: templates/CODEOWNERS
  - path: SECURITY.md
    source: templates/SECURITY.md
  - path: CONTRIBUTING.md
    source: templates/CONTRIBUTING.md
  - path: README.md
    source: templates/README.md
  - path: .gitignore
    source: templates/.gitignore
  - path: .github/copilot-instructions.md
    source: templates/copilot-instructions.md
  - path: LICENSE
    source: templates/LICENSE
  - path: DATA_CLASSIFICATION.md
    source: templates/DATA_CLASSIFICATION.md

workflows:
  - name: ci.yml
    description: Continuous Integration
    required: true
  - name: cd.yml
    description: Continuous Deployment
    required: true
  - name: codeql.yml
    description: CodeQL security scanning
    required: true
  - name: iac-guardrails.yml
    description: Terraform validation
    required: true
  - name: release.yml
    description: Semantic versioning releases
    required: true

environments:
  - name: dev
    protection_rules:
      required_reviewers: []
      wait_timer: 0
  - name: test
    protection_rules:
      required_reviewers:
        - count: 1
      wait_timer: 0
  - name: staging
    protection_rules:
      required_reviewers:
        - count: 2
      wait_timer: 0
  - name: production
    protection_rules:
      required_reviewers:
        - count: 2
      wait_timer: 10

security:
  code_scanning:
    enabled: true
    tool: codeql
    languages: []
  secret_scanning:
    enabled: true
    push_protection: true
  dependabot:
    alerts: true
    security_updates: true
    version_updates:
      ecosystems:
        - package-ecosystem: github-actions
          directory: /
          schedule: weekly
        - package-ecosystem: terraform
          directory: /infra/terraform
          schedule: weekly
        - package-ecosystem: pip
          directory: /
          schedule: weekly
  dependency_review:
    enabled: true
    fail_on_severity: moderate

azure:
  oidc:
    enabled: true
    federated_credentials:
      - name: github-main
        subject: "repo:${REPO}:ref:refs/heads/main"
      - name: github-pr
        subject: "repo:${REPO}:pull_request"
      - name: github-env-staging
        subject: "repo:${REPO}:environment:staging"
      - name: github-env-production
        subject: "repo:${REPO}:environment:production"
  rbac:
    assignments:
      - role: Contributor
        scope: resource_group
      - role: "Storage Blob Data Contributor"
        scope: resource_group
  key_vault:
    enabled: true
    purpose: "Store data pipeline secrets, connection strings, and encryption keys"
  policy_assignments:
    - name: "Require encryption at rest"
    - name: "Require private endpoints for storage"

labels:
  - name: bug
    color: "d73a4a"
    description: Something isn't working
  - name: enhancement
    color: "a2eeef"
    description: New feature or request
  - name: documentation
    color: "0075ca"
    description: Improvements or additions to documentation
  - name: security
    color: "e4e669"
    description: Security-related issue
  - name: infrastructure
    color: "d4c5f9"
    description: Infrastructure as Code changes
  - name: data-pipeline
    color: "1d76db"
    description: Data pipeline changes
  - name: compliance
    color: "b60205"
    description: Compliance-related changes
  - name: dependencies
    color: "0366d6"
    description: Dependency updates
  - name: priority/high
    color: "b60205"
    description: High priority
  - name: priority/medium
    color: "fbca04"
    description: Medium priority
  - name: priority/low
    color: "0e8a16"
    description: Low priority

teams:
  - slug: "${TEAM_SLUG}-maintainers"
    permission: maintain
  - slug: "${TEAM_SLUG}-developers"
    permission: push
  - slug: "${TEAM_SLUG}-data-engineers"
    permission: push
  - slug: security-team
    permission: pull
  - slug: compliance-team
    permission: pull

project:
  enabled: true
  name: "${PROJECT_NAME} Board"
  columns:
    - "Backlog"
    - "Ready"
    - "In Progress"
    - "In Review"
    - "Done"

# --------------------------------------------------------------------------
# Webhooks
# --------------------------------------------------------------------------
webhooks:
  - url: "${WEBHOOK_URL:-}"
    events:
      - push
      - pull_request
      - deployment_status
    content_type: json
    active: true

# --------------------------------------------------------------------------
# Milestones
# --------------------------------------------------------------------------
milestones:
  - title: "v1.0 - Data Foundation"
    description: "Core data models, storage, and ingestion pipelines"
  - title: "v1.1 - Transformation Layer"
    description: "ETL/ELT pipelines and data quality checks"
  - title: "v2.0 - Production & Compliance"
    description: "Production deployment with lineage tracking and audit"
