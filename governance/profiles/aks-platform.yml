# ============================================================================
# Governance Profile: AKS Platform
# ============================================================================
# Profile for Azure Kubernetes Service platform teams managing shared
# clusters, infrastructure, and platform services.
# ============================================================================

name: AKS Platform
description: Azure Kubernetes Service platform with GitOps, Flux, and strict infrastructure governance
version: "1.0.0"

# --------------------------------------------------------------------------
# Repository Settings
# --------------------------------------------------------------------------
repository:
  visibility: private
  default_branch: main
  delete_branch_on_merge: true
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  allow_auto_merge: true
  has_issues: true
  has_projects: true
  has_wiki: false
  is_template: false
  topics:
    - aks
    - kubernetes
    - platform
    - gitops
    - infrastructure

# --------------------------------------------------------------------------
# Branch Protection / Rulesets
# --------------------------------------------------------------------------
rulesets:
  - name: main-protection
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - "refs/heads/main"
    rules:
      pull_request:
        required_approving_review_count: 2
        dismiss_stale_reviews: true
        require_code_owner_review: true
        require_last_push_approval: true
      required_status_checks:
        strict_required_status_checks_policy: true
        required_status_checks:
          - context: "CI Pipeline / Lint & Format"
          - context: "CI Pipeline / Unit Tests"
          - context: "CI Pipeline / Build"
          - context: "IaC Guardrails / Terraform Validate"
          - context: "IaC Guardrails / Bicep Validate"
          - context: "Security / CodeQL"
          - context: "Security / Checkov"
      required_linear_history: true
      required_signatures: true
      deletion: true
      non_fast_forward: true
    bypass_actors:
      - actor_type: OrganizationAdmin
      - actor_type: RepositoryRole
        role: maintain
  - name: release-protection
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - "refs/heads/release/*"
    rules:
      pull_request:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_review: true
        require_last_push_approval: false
      deletion: true
      non_fast_forward: true
    bypass_actors:
      - actor_type: OrganizationAdmin

# --------------------------------------------------------------------------
# Required Files
# --------------------------------------------------------------------------
required_files:
  - path: CODEOWNERS
    source: templates/CODEOWNERS
  - path: SECURITY.md
    source: templates/SECURITY.md
  - path: CONTRIBUTING.md
    source: templates/CONTRIBUTING.md
  - path: README.md
    source: templates/README.md
  - path: .gitignore
    source: templates/.gitignore
  - path: .github/pull_request_template.md
    source: templates/pull_request_template.md
  - path: .github/copilot-instructions.md
    source: templates/copilot-instructions.md
  - path: LICENSE
    source: templates/LICENSE
  - path: Dockerfile
    source: templates/Dockerfile
  - path: kubernetes/kustomization.yaml
    source: templates/kustomization.yaml

# --------------------------------------------------------------------------
# Workflows
# --------------------------------------------------------------------------
workflows:
  - name: ci.yml
    description: Continuous Integration (lint, test, build, container scan)
    required: true
  - name: cd.yml
    description: Continuous Deployment with GitOps promotion
    required: true
  - name: codeql.yml
    description: CodeQL security scanning
    required: true
  - name: iac-guardrails.yml
    description: Terraform and Bicep validation
    required: true
  - name: release.yml
    description: Semantic versioning releases
    required: true
  - name: container-scan.yml
    description: Container image vulnerability scanning
    required: true
  - name: label-sync.yml
    description: Automated label synchronization
    required: false
  - name: stale.yml
    description: Stale issue/PR cleanup
    required: false

# --------------------------------------------------------------------------
# Environments
# --------------------------------------------------------------------------
environments:
  - name: dev
    protection_rules:
      required_reviewers: []
      wait_timer: 0
    deployment_branch_policy:
      protected_branches: false
      custom_branches:
        - "feature/*"
        - "main"
  - name: staging
    protection_rules:
      required_reviewers:
        - count: 1
      wait_timer: 0
    deployment_branch_policy:
      protected_branches: false
      custom_branches:
        - "main"
        - "release/*"
  - name: production
    protection_rules:
      required_reviewers:
        - count: 2
      wait_timer: 10
    deployment_branch_policy:
      protected_branches: true
  - name: dr
    protection_rules:
      required_reviewers:
        - count: 2
      wait_timer: 15
    deployment_branch_policy:
      protected_branches: true

# --------------------------------------------------------------------------
# Security Controls
# --------------------------------------------------------------------------
security:
  code_scanning:
    enabled: true
    tool: codeql
    languages: []
  secret_scanning:
    enabled: true
    push_protection: true
  dependabot:
    alerts: true
    security_updates: true
    version_updates:
      ecosystems:
        - package-ecosystem: github-actions
          directory: /
          schedule: weekly
        - package-ecosystem: terraform
          directory: /infra/terraform
          schedule: weekly
        - package-ecosystem: docker
          directory: /
          schedule: weekly
        - package-ecosystem: gomod
          directory: /
          schedule: weekly
  dependency_review:
    enabled: true
    fail_on_severity: moderate

# --------------------------------------------------------------------------
# Azure Integration
# --------------------------------------------------------------------------
azure:
  oidc:
    enabled: true
    federated_credentials:
      - name: github-main
        subject: "repo:${REPO}:ref:refs/heads/main"
      - name: github-pr
        subject: "repo:${REPO}:pull_request"
      - name: github-env-staging
        subject: "repo:${REPO}:environment:staging"
      - name: github-env-production
        subject: "repo:${REPO}:environment:production"
      - name: github-env-dr
        subject: "repo:${REPO}:environment:dr"
  rbac:
    assignments:
      - role: Contributor
        scope: resource_group
      - role: "Azure Kubernetes Service Cluster Admin Role"
        scope: resource_group
      - role: "AcrPush"
        scope: resource_group
      - role: "Network Contributor"
        scope: resource_group
  key_vault:
    enabled: true
    purpose: "TLS certificates, container registry credentials, and cluster secrets"
  policy_assignments:
    - name: "Kubernetes cluster pods should only use approved host network and port range"
    - name: "Kubernetes clusters should not allow container privilege escalation"
    - name: "Kubernetes cluster containers should only use allowed images"
    - name: "Require private endpoints for AKS"

# --------------------------------------------------------------------------
# Labels
# --------------------------------------------------------------------------
labels:
  - name: bug
    color: "d73a4a"
    description: Something isn't working
  - name: enhancement
    color: "a2eeef"
    description: New feature or request
  - name: documentation
    color: "0075ca"
    description: Improvements or additions to documentation
  - name: security
    color: "e4e669"
    description: Security-related issue
  - name: infrastructure
    color: "d4c5f9"
    description: Infrastructure as Code changes
  - name: kubernetes
    color: "326ce5"
    description: Kubernetes/AKS configuration
  - name: networking
    color: "1d76db"
    description: Network configuration changes
  - name: gitops
    color: "7057ff"
    description: GitOps/Flux configuration
  - name: container
    color: "0e8a16"
    description: Container image changes
  - name: compliance
    color: "b60205"
    description: Compliance-related changes
  - name: dependencies
    color: "0366d6"
    description: Dependency updates
  - name: priority/high
    color: "b60205"
    description: High priority
  - name: priority/medium
    color: "fbca04"
    description: Medium priority
  - name: priority/low
    color: "0e8a16"
    description: Low priority
  - name: breaking-change
    color: "b60205"
    description: Breaking change requiring coordination

# --------------------------------------------------------------------------
# Teams
# --------------------------------------------------------------------------
teams:
  - slug: "${TEAM_SLUG}"
    permission: push
  - slug: "${TEAM_SLUG}-leads"
    permission: maintain
  - slug: "platform-engineering"
    permission: admin
  - slug: "security-team"
    permission: triage

# --------------------------------------------------------------------------
# Project Board
# --------------------------------------------------------------------------
project:
  enabled: true
  name: "${PROJECT_NAME}"
  views:
    - name: Board
      layout: board
    - name: Sprint
      layout: table
    - name: Roadmap
      layout: roadmap

# --------------------------------------------------------------------------
# Webhooks
# --------------------------------------------------------------------------
webhooks:
  - url: "${WEBHOOK_URL:-}"
    events:
      - push
      - pull_request
      - deployment_status
      - workflow_run
    content_type: json
    active: true

# --------------------------------------------------------------------------
# Milestones
# --------------------------------------------------------------------------
milestones:
  - title: "v1.0 - Platform Foundation"
    description: "AKS cluster provisioning, networking, and base configuration"
  - title: "v1.1 - Observability"
    description: "Monitoring, logging, alerting, and dashboards"
  - title: "v1.2 - Security Hardening"
    description: "Network policies, pod security, and compliance scanning"
  - title: "v2.0 - Multi-region"
    description: "DR setup, traffic management, and failover automation"
